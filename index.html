<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVBox 接口导航</title>
<!--
  ============================================================
  TVBox 接口导航 · 单文件页面（数据与视图分离）
  ------------------------------------------------------------
  数据在页面底部的 DATA 脚本块（application/json）里，
  字段说明与示例见同目录 tvbox-data.json。
  改数据两种方式：
    1) 直接改 DATA 里的 JSON
    2) 点右上角「{ } 数据」→ 粘贴 / 导入 tvbox-data.json → 应用
  ============================================================
-->
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --fg:#171a1f; --dim:#6b7280; --dim2:#9aa3b2;
  --line:#e8eaee; --soft:#f7f8fa; --acc:#e64a19; --acc-soft:#fff1ec;
  --ok:#16a34a; --ok-soft:#eaf7ee; --warn:#d97706; --warn-soft:#fef6e7;
  --off:#94a3b8; --off-soft:#f1f3f6;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1014; --card:#161920; --fg:#e7eaf0; --dim:#98a2b3; --dim2:#6b7480;
    --line:#232833; --soft:#1b1f28; --acc:#ff6b3d; --acc-soft:#2a1a13;
    --ok:#34d399; --ok-soft:#12251c; --warn:#fbbf24; --warn-soft:#2a2113;
    --off:#6b7480; --off-soft:#1a1e26;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{max-width:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 90px}

/* ---------- 顶部 ---------- */
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.head h1{margin:0;font-size:20px;letter-spacing:.2px;font-weight:700}
.head .meta{margin-top:3px;font-size:12.5px;color:var(--dim);line-height:1.7}
.head .meta b{color:var(--fg);font-weight:600}
.head .spacer{flex:1}
.icon-btn{
  flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);
  border-radius:9px;font-size:12.5px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);
  font-family:inherit;
}
.icon-btn:hover{color:var(--acc);border-color:var(--acc)}

/* ---------- 随机轮换 ---------- */
.spot{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;
}
.spot[hidden]{display:none}
.spot::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--acc),#ff9a5c)}
.spot.flash{animation:flash .8s}
.spot-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.spot-tag{font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:2px 9px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.spot h2{margin:0;font-size:17px;font-weight:700}
.spot .gchip{font-size:11.5px;background:var(--fg);color:var(--card);border-radius:20px;padding:2px 9px;white-space:nowrap}
.spot .desc{margin:2px 0 10px;color:var(--dim);font-size:12.5px}
.spot .line{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:9px;padding:7px 10px;flex-wrap:wrap}
.spot .line a{flex:1;min-width:0;color:var(--fg);text-decoration:none;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.spot .line a:hover{color:var(--acc)}
.spot-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.mini{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:11.5px;border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap;font-family:inherit}
.mini:hover{color:var(--acc);border-color:var(--acc)}

/* ---------- 工具栏 ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0}
.toolbar .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:12.5px;
  cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(.94);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn .n{font-variant-numeric:tabular-nums;opacity:.7;font-size:11.5px}
.btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.on.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.on.offb{background:var(--off-soft);border-color:var(--off);color:var(--fg)}
.progress{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.search{position:relative;margin:0 0 8px}
.search input{
  width:100%;height:42px;padding:0 40px 0 38px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--fg);font-size:14px;outline:none;transition:.15s;font-family:inherit;
}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search .mag{position:absolute;left:13px;top:11px;color:var(--dim2);font-size:16px;pointer-events:none}
.search .clear{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;background:transparent;color:var(--dim2);cursor:pointer;border-radius:6px;font-size:16px;display:none}
.search .clear:hover{color:var(--acc);background:var(--soft)}

/* ---------- 分组 ---------- */
.groups{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.groups::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:12.5px;cursor:pointer;
  transition:.15s;white-space:nowrap;font-family:inherit;
}
.chip:hover{color:var(--fg);border-color:var(--dim2)}
.chip.active{background:var(--fg);border-color:var(--fg);color:var(--card);font-weight:600}
.chip .c{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip.active .c{opacity:.75}
.chip.res{color:var(--dim2);border-style:dashed}
.chip.res.active{background:var(--off);border-color:var(--off);color:#fff;border-style:solid}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:border-color .15s, transform .15s;
}
.card:hover{border-color:#d6dae1;transform:translateY(-1px)}
@media (prefers-color-scheme:dark){.card:hover{border-color:#2f3644}}
.card.spot-card{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-soft),var(--card) 60%)}
.card.flash{animation:flash .8s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc-soft)}100%{box-shadow:var(--shadow)}}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctop h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.2px;min-width:0}
.w-badge{font-size:10.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.ctop .spacer{flex:1}
.st{font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.st.wait{color:var(--dim2);background:var(--off-soft)}
.st.ing{color:var(--acc);background:var(--acc-soft)}
.st.ok{color:var(--ok);background:var(--ok-soft)}
.st.mid{color:var(--warn);background:var(--warn-soft)}
.st.bad{color:var(--off);background:var(--off-soft)}
.card .desc{margin:5px 0 0;color:var(--dim);font-size:12.5px;line-height:1.6}
.meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.gtag{font-size:11px;border-radius:5px;padding:1.5px 7px;background:var(--acc-soft);color:var(--acc);font-weight:600;white-space:nowrap}
.gtag.res{background:var(--off-soft);color:var(--dim)}
.tag{font-size:11px;border-radius:5px;padding:1.5px 7px;background:var(--soft);color:var(--dim);white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:1px}
.src:hover{color:var(--acc);border-bottom-color:var(--acc)}
.src::after{content:"↗";font-size:10px;opacity:.7}

.urls{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.urls li{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:9px;padding:6px 9px;min-width:0}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--dim2)}
.dot.ok{background:var(--ok)}
.dot.mid{background:var(--warn)}
.dot.bad{background:var(--off)}
.dot.ing{background:var(--acc);animation:pulse 1.2s infinite}
.urls .u{flex:1;min-width:0;color:var(--fg);text-decoration:none;opacity:.9;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.urls .u:hover{color:var(--acc);opacity:1}
.urls .lab{flex:none;font-size:10.5px;color:var(--dim2);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.urls .lat{flex:none;font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.urls .lat.ok{color:var(--ok);font-weight:600}
.urls .lat.mid{color:var(--warn);font-weight:600}
.cp{flex:none;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:11px;border-radius:6px;padding:3px 8px;cursor:pointer;transition:.15s;font-family:inherit}
.cp:hover{color:var(--acc);border-color:var(--acc)}
.cp.ok{color:var(--ok);border-color:var(--ok)}

.empty{text-align:center;color:var(--dim);padding:56px 20px;font-size:13.5px}
.empty .big{font-size:26px;display:block;margin-bottom:8px;opacity:.5}

/* ---------- 数据抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,24,.45);z-index:60;display:none}
.mask.show{display:block}
.drawer{
  position:fixed;z-index:61;top:0;right:0;height:100%;width:min(580px,94vw);
  background:var(--card);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;
}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h4{margin:0;font-size:14px}
.drawer header .spacer{flex:1}
.drawer .body{padding:12px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.drawer textarea{
  flex:1;min-height:320px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;
  background:var(--soft);color:var(--fg);padding:10px 12px;font:11.8px/1.55 ui-monospace,Menlo,monospace;outline:none;
}
.drawer textarea:focus{border-color:var(--acc)}
.drawer .hint{font-size:11.5px;color:var(--dim2);line-height:1.75}
.drawer .hint code{background:var(--soft);border-radius:4px;padding:0 4px;font-size:11px}
.drawer footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:80;
  background:var(--fg);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.2s;max-width:80vw;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{margin-top:22px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:16px 12px 80px}
  .head h1{font-size:18px}
  .progress{margin-left:0;width:100%}
  .card{padding:11px 12px}
  .urls .u{font-size:11.5px}
  .urls .lat{min-width:40px;font-size:11px}
  .spot{padding:12px}
}
</style>
</head>

</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <header>

    <button class="mini" id="btnCloseDrawer">关闭</button>
  </header>
  <div class="body">
    <div class="hint">
      改完点「应用」立即生效（不写回文件）。字段：<code>name</code> 名称 · <code>desc</code> 说明 ·
      <code>group</code> 主分组 · <code>tags</code> 附加标签 · <code>weight</code> 权重（越小越靠前，缺省=不参与排序）·
      <code>source</code> 来源 <code>{name,url}</code> · <code>urls</code> 地址数组 <code>[{label,url}]</code>。
    </div>
    <textarea id="jsonBox" spellcheck="false"></textarea>
    <div class="hint">也可以点「导入文件」，选中 <code>tvbox-data.json</code> 后点「应用」。</div>
  </div>
  <footer>
    <button class="btn primary" id="btnApply">应用</button>
    <button class="btn" id="btnImport">导入文件</button>
    <button class="btn" id="btnReset">恢复默认</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </footer>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= 可调参数 ================= */
  var TIMEOUT_MS = 12000;   // 单条超时（与参考站一致）
  var CONCURRENCY = 6;      // 并发检测数
  var UNWEIGHTED = 999;     // 未设权重的排序位
  var SLOW_MS = 1500;       // 慢速阈值

  var DEFAULT_JSON = document.getElementById('DATA').textContent;
  var DATA = null;
  var RAW = null;
  var state = {
    groups: [], group: 'all', status: 'all', keyword: '',
    detecting: false, abort: false, done: 0, total: 0,
    seed: Date.now(), spotId: null
  };

  function el(id){ return document.getElementById(id); }
  var listEl = el('list'), groupsEl = el('groups'), spotEl = el('spot');

  /* ================= 小工具 ================= */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showUrl(u){ try { return decodeURI(u); } catch(e){ return u; } }

  function hashRand(str, seed){
    var h = 2166136261 ^ seed;
    for (var i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967296;
  }

  function toast(msg){
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }

  /* ================= 归一化 ================= */
  function normalize(raw){
    var groups = (raw.groups || []).map(function(g, i){
      return {
        id: g.id, name: g.name,
        weight: typeof g.weight === 'number' ? g.weight : 10,
        isApi: g.isApi !== false,
        order: i
      };
    });
    var gmap = {};
    groups.forEach(function(g){ gmap[g.id] = g; });

    var items = (raw.items || []).map(function(it, idx){
      var g = gmap[it.group] || groups[0] || { id: 'other', name: '其他', isApi: false };
      var urls = (it.urls || []).filter(function(u){ return u && u.url; }).map(function(u, i){
        return { uid: (it.id || ('i' + idx)) + '#' + i, label: u.label || '', url: u.url, status: 'wait', lat: null };
      });
      return {
        id: it.id || ('i' + idx),
        name: it.name || '未命名',
        desc: it.desc || '',
        group: g.id, groupName: g.name, isApi: g.isApi,
        tags: Array.isArray(it.tags) ? it.tags : [],
        weight: (typeof it.weight === 'number' && it.weight > 0) ? it.weight : UNWEIGHTED,
        source: it.source || null,
        urls: urls, status: 'wait', lat: null,
        rand: hashRand(it.id || String(idx), state.seed)
      };
    });
    return { groups: groups, items: items, site: raw.site || {}, updated: raw.updated || '' };
  }

  /* ================= 头部 / 分组 ================= */
  function renderHead(){
    el('title').textContent = DATA.site.title || 'TVBox 接口导航';
    var apiCount = DATA.items.filter(function(i){ return i.isApi; }).length;
    var resCount = DATA.items.length - apiCount;
    var urlCount = DATA.items.reduce(function(a, i){ return a + i.urls.length; }, 0);
    el('meta').innerHTML =
      '共 <b>' + apiCount + '</b> 个接口' +
      (resCount ? ' · <b>' + resCount + '</b> 个空壳/其他资源' : '') +
      ' · <b>' + urlCount + '</b> 条地址' +
      ' <span style="opacity:.5">|</span> 更新 ' + esc(DATA.updated || '—') +
      ' <span style="opacity:.5">|</span> 打开即自动测速';
    el('foot').textContent = DATA.site.footer || '';
  }

  function groupCount(){
    var m = { all: DATA.items.length };
    DATA.groups.forEach(function(g){ m[g.id] = 0; });
    DATA.items.forEach(function(i){ m[i.group] = (m[i.group] || 0) + 1; });
    return m;
  }

  function renderGroups(){
    var counts = groupCount();
    var html = '<button class="chip' + (state.group === 'all' ? ' active' : '') + '" data-g="all">全部 <span class="c">' + counts.all + '</span></button>';
    DATA.groups.forEach(function(g){
      var n = counts[g.id] || 0;
      if (!n) return;
      html += '<button class="chip' + (g.isApi ? '' : ' res') + (state.group === g.id ? ' active' : '') +
              '" data-g="' + esc(g.id) + '">' + esc(g.name) + ' <span class="c">' + n + '</span></button>';
    });
    groupsEl.innerHTML = html;
  }

  /* ================= 状态 ================= */
  function itemStatus(it){
    var best = null, checking = false, blocked = false, allDown = it.urls.length > 0;
    it.urls.forEach(function(u){
      if (u.status === 'ok'){ if (best === null || u.lat < best) best = u.lat; }
      if (u.status === 'checking') checking = true;
      if (u.status === 'blocked') blocked = true;
      if (u.status !== 'bad' && u.status !== 'blocked') allDown = false;
    });
    if (best !== null){ it.status = 'ok'; it.lat = best; return; }
    if (checking){ it.status = 'wait'; it.lat = null; return; }
    if (allDown){ it.status = blocked ? 'blocked' : 'bad'; it.lat = null; return; }
    it.status = 'wait'; it.lat = null;
  }

  function statusMeta(st, lat){
    if (st === 'ok') return (lat !== null && lat >= SLOW_MS) ? { cls: 'mid', text: lat + ' ms' } : { cls: 'ok', text: lat + ' ms' };
    if (st === 'bad') return { cls: 'bad', text: '离线' };
    if (st === 'blocked') return { cls: 'bad', text: '受限' };
    return { cls: 'wait', text: '待检测' };
  }

  /* ================= 卡片 ================= */
  function cardHtml(it, opt){
    opt = opt || {};
    var sm = statusMeta(it.status, it.lat);
    var src = '';
    if (it.source && it.source.url){
      src = '<a class="src" href="' + esc(it.source.url) + '" target="_blank" rel="noopener">' +
            esc(it.source.name || it.source.url) + '</a>';
    } else if (it.source && it.source.name){
      src = '<span class="tag">' + esc(it.source.name) + '</span>';
    }

    var tags = '<span class="gtag' + (it.isApi ? '' : ' res') + '">' + esc(it.groupName) + '</span>';
    it.tags.forEach(function(t){ tags += '<span class="tag">' + esc(t) + '</span>'; });

    var urls = it.urls.map(function(u){
      var dotCls = u.status === 'ok' ? (u.lat >= SLOW_MS ? 'mid' : 'ok')
                 : u.status === 'checking' ? 'ing'
                 : (u.status === 'bad' || u.status === 'blocked') ? 'bad' : '';
      var latText = u.status === 'ok' ? (u.lat + ' ms')
                  : u.status === 'checking' ? '…'
                  : u.status === 'bad' ? '离线'
                  : u.status === 'blocked' ? '受限' : '—';
      var latCls = u.status === 'ok' ? (u.lat >= SLOW_MS ? ' mid' : ' ok') : '';
      return '<li data-uid="' + esc(u.uid) + '">' +
        '<span class="dot ' + dotCls + '"></span>' +
        (u.label ? '<span class="lab">' + esc(u.label) + '</span>' : '') +
        '<a class="u" href="' + esc(u.url) + '" target="_blank" rel="noopener" title="' + esc(u.url) + '">' + esc(showUrl(u.url)) + '</a>' +
        '<span class="lat' + latCls + '">' + latText + '</span>' +
        '<button class="cp" data-url="' + esc(u.url) + '">复制</button>' +
      '</li>';
    }).join('');

    return '<article class="card' + (opt.spot ? ' spot-card' : '') + '" data-id="' + esc(it.id) + '">' +
      '<div class="ctop">' +
        (opt.spot ? '<span class="spot-tag">本次轮换</span>' : '') +
        '<h3>' + esc(it.name) + '</h3>' +
        (it.weight !== UNWEIGHTED ? '<span class="w-badge" title="权重，数字越小越靠前">W' + it.weight + '</span>' : '') +
        '<span class="spacer"></span>' +
        '<span class="st ' + sm.cls + '">' + sm.text + '</span>' +
      '</div>' +
      (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : '') +
      '<div class="meta-row">' + tags + src + '</div>' +
      '<ul class="urls">' + urls + '</ul>' +
    '</article>';
  }

  /* ================= 排序 / 过滤 ================= */
  function statusRank(it){
    if (it.status === 'ok') return 0;
    if (it.status === 'bad' || it.status === 'blocked') return 2;
    return 1;   // 待检测 / 检测中
  }

  function sortItems(arr){
    return arr.slice().sort(function(a, b){
      var d = statusRank(a) - statusRank(b);
      if (d) return d;
      if (a.weight !== b.weight) return a.weight - b.weight;  // 权重小的在前
      return a.rand - b.rand;                                  // 同权重 / 未设权重 → 随机
    });
  }

  function matched(it){
    if (state.group !== 'all' && it.group !== state.group) return false;
    if (state.status === 'online' && it.status !== 'ok') return false;
    if (state.status === 'offline' && !(it.status === 'bad' || it.status === 'blocked')) return false;
    var k = state.keyword;
    if (!k) return true;
    var hay = (it.name + ' ' + it.desc + ' ' + it.groupName + ' ' + it.tags.join(' ') + ' ' +
               (it.source ? (it.source.name || '') : '') + ' ' +
               it.urls.map(function(u){ return u.url; }).join(' ')).toLowerCase();
    return hay.indexOf(k) !== -1;
  }

  /* ================= 列表渲染 ================= */
  function render(){
    var sorted = sortItems(DATA.items.filter(matched));
    var spotItem = null;

    if (state.spotId && !state.keyword && state.group === 'all' && state.status === 'all'){
      for (var i = 0; i < sorted.length; i++){
        if (sorted[i].id === state.spotId){ spotItem = sorted[i]; break; }
      }
    }

    var html = '';
    if (spotItem){
      // 轮换项固定在上方面板展示，列表里不再重复出现
      sorted = sorted.filter(function(x){ return x.id !== spotItem.id; });
    }
    html += sorted.map(function(it){ return cardHtml(it); }).join('');

    if (!sorted.length && !spotItem){
      html = '<div class="empty"><span class="big">∅</span>没有匹配的接口<br>' +
             '<span style="font-size:12px;opacity:.7">换个分组或清空搜索，也可以点「重新检测」</span></div>';
    }
    listEl.innerHTML = html;
    renderSpotPanel(spotItem);
    updateCounts();
  }

  function renderSpotPanel(spotItem){
    if (!spotItem){ spotEl.hidden = true; return; }
    spotEl.hidden = false;
    var g = DATA.groups.filter(function(x){ return x.id === spotItem.group; })[0] || { name: spotItem.groupName };
    var u = spotItem.urls[0];
    var sm = statusMeta(spotItem.status, spotItem.lat);
    spotEl.innerHTML =
      '<div class="spot-top">' +
        '<span class="spot-tag">🎲 本次随机轮换</span>' +
        '<span class="gchip">' + esc(g.name) + '组</span>' +
        '<h2>' + esc(spotItem.name) + '</h2>' +
        '<span class="st ' + sm.cls + '" style="margin-left:auto">' + sm.text + '</span>' +
      '</div>' +
      '<p class="desc">' + esc(spotItem.desc || '—') + '</p>' +
      '<div class="line"><a href="' + esc(u.url) + '" target="_blank" rel="noopener">' + esc(showUrl(u.url)) + '</a>' +
        '<div class="spot-actions">' +
          '<button class="mini" data-copy="' + esc(u.url) + '">复制</button>' +
          '<button class="mini" id="btnReroll">换一个 ↻</button>' +
        '</div>' +
      '</div>';
  }

  function updateCounts(){
    var on = 0, off = 0;
    DATA.items.forEach(function(it){
      if (it.status === 'ok') on++;
      else if (it.status === 'bad' || it.status === 'blocked') off++;
    });
    el('nOnline').textContent = on;
    el('nOffline').textContent = off;
    var bo = el('btnOnline'), bf = el('btnOffline');
    bo.classList.toggle('on', state.status === 'online');
    bo.classList.toggle('okb', state.status === 'online');
    bf.classList.toggle('on', state.status === 'offline');
    bf.classList.toggle('offb', state.status === 'offline');
  }

  /* ================= 局部更新 ================= */
  function findUrl(uid){
    for (var i = 0; i < DATA.items.length; i++){
      var us = DATA.items[i].urls;
      for (var j = 0; j < us.length; j++) if (us[j].uid === uid) return { it: DATA.items[i], u: us[j] };
    }
    return null;
  }

  function patchUrl(uid){
    var found = findUrl(uid);
    if (!found) return;
    var it = found.it, u = found.u;
    var li = null;
    var nodes = listEl.querySelectorAll('li[data-uid]');
    for (var i = 0; i < nodes.length; i++){ if (nodes[i].getAttribute('data-uid') === uid){ li = nodes[i]; break; } }

    if (li){
      var dot = li.querySelector('.dot'), lat = li.querySelector('.lat');
      var cls = u.status === 'ok' ? (u.lat >= SLOW_MS ? 'mid' : 'ok')
              : u.status === 'checking' ? 'ing'
              : (u.status === 'bad' || u.status === 'blocked') ? 'bad' : '';
      if (dot) dot.className = 'dot ' + cls;
      if (lat){
        lat.className = 'lat' + (u.status === 'ok' ? (u.lat >= SLOW_MS ? ' mid' : ' ok') : '');
        lat.textContent = u.status === 'ok' ? (u.lat + ' ms')
                        : u.status === 'checking' ? '…'
                        : u.status === 'bad' ? '离线'
                        : u.status === 'blocked' ? '受限' : '—';
      }
      var card = li.closest('.card');
      if (card){
        itemStatus(it);
        var sm = statusMeta(it.status, it.lat);
        var st = card.querySelector('.st');
        if (st){ st.className = 'st ' + sm.cls; st.textContent = sm.text; }
      }
    }
    itemStatus(it);
    // 同步轮换面板上的状态
    if (it.id === state.spotId && spotEl && !spotEl.hidden){
      var sst = spotEl.querySelector('.st');
      if (sst){ var m2 = statusMeta(it.status, it.lat); sst.className = 'st ' + m2.cls; sst.textContent = m2.text; }
    }
    updateCounts();
  }

  /* ================= 检测 ================= */
  function noCache(url){
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    return url + sep + '_t=' + Date.now();
  }

  function probe(url){
    // https 页面无法请求 http 目标（混合内容会被浏览器拦截）
    if (location.protocol === 'https:' && /^http:\/\//i.test(url)){
      return Promise.resolve({ blocked: true });
    }
    var ctrl = new AbortController();
    var t0 = performance.now();
    var timer = setTimeout(function(){ ctrl.abort(); }, TIMEOUT_MS);
    return fetch(noCache(url), {
      method: 'GET', mode: 'no-cors', cache: 'no-store', redirect: 'follow', signal: ctrl.signal,
      headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
    }).then(function(){
      clearTimeout(timer);
      return { ok: true, lat: Math.round(performance.now() - t0) };
    }).catch(function(){
      clearTimeout(timer);
      return { ok: false };
    });
  }

  function setProgress(text, spinning){
    el('progress').innerHTML = (spinning ? '<span class="pulse"></span>' : '') +
      '<span>' + esc(text) + '</span>';
  }

  function resetStates(){
    DATA.items.forEach(function(it){
      it.urls.forEach(function(u){ u.status = 'wait'; u.lat = null; });
      it.status = 'wait'; it.lat = null;
    });
  }

  function startCheck(){
    if (state.detecting) return;
    state.detecting = true; state.abort = false; state.done = 0;
    resetStates();
    render();

    var queue = [];
    DATA.items.forEach(function(it){
      it.urls.forEach(function(u){ queue.push({ it: it, u: u }); });
    });
    state.total = queue.length;
    el('btnRecheck').disabled = true;
    el('btnRecheck').textContent = '检测中…';
    setProgress('检测中 0/' + queue.length, true);

    var idx = 0;
    function worker(){
      if (state.abort || idx >= queue.length) return Promise.resolve();
      var job = queue[idx++];
      job.u.status = 'checking';
      patchUrl(job.u.uid);
      return probe(job.u.url).then(function(r){
        if (state.abort) return;
        job.u.status = r.blocked ? 'blocked' : (r.ok ? 'ok' : 'bad');
        job.u.lat = r.ok ? r.lat : null;
        state.done++;
        patchUrl(job.u.uid);
        setProgress('检测中 ' + state.done + '/' + state.total, true);
        return worker();
      });
    }

    var workers = [];
    for (var i = 0; i < Math.min(CONCURRENCY, queue.length); i++) workers.push(worker());

    Promise.all(workers).then(function(){
      state.detecting = false;
      el('btnRecheck').disabled = false;
      el('btnRecheck').textContent = '⟳ 重新检测';
      var on = DATA.items.filter(function(x){ return x.status === 'ok'; }).length;
      setProgress('检测完成 · 在线 ' + on + ' / ' + DATA.items.length, false);
      render();   // 全部测完后：在线 → 权重 → 随机，重新排序
    });
  }

  /* ================= 随机轮换 ================= */
  function pickSpot(){
    var pool = DATA.items.filter(function(it){ return it.isApi && it.weight !== UNWEIGHTED; });
    if (!pool.length) pool = DATA.items.filter(function(it){ return it.isApi; });
    if (!pool.length) pool = DATA.items.slice();
    if (!pool.length){ state.spotId = null; return; }

    // 1) 按「组权重」加权，随机轮换到一个组
    var byGroup = {};
    pool.forEach(function(it){ (byGroup[it.group] = byGroup[it.group] || []).push(it); });
    var gids = Object.keys(byGroup);
    var totalW = 0;
    gids.forEach(function(gid){
      var g = DATA.groups.filter(function(x){ return x.id === gid; })[0];
      totalW += (g ? Math.max(1, g.weight) : 10);
    });
    var r = Math.random() * totalW, acc = 0, gid = gids[0];
    for (var i = 0; i < gids.length; i++){
      var g2 = DATA.groups.filter(function(x){ return x.id === gids[i]; })[0];
      acc += (g2 ? Math.max(1, g2.weight) : 10);
      if (r <= acc){ gid = gids[i]; break; }
    }

    // 2) 组内按权重倒数做加权随机（保证权重靠前的更容易被选中，但不垄断）
    var cands = byGroup[gid], sum = 0;
    var iw = cands.map(function(it){ var v = 1 / Math.max(1, it.weight); sum += v; return v; });
    var rr = Math.random() * sum, a = 0, pick = cands[0];
    for (var j = 0; j < cands.length; j++){
      a += iw[j];
      if (rr <= a){ pick = cands[j]; break; }
    }
    state.spotId = pick.id;
  }

  /* ================= 事件绑定 ================= */
  el('q').addEventListener('input', function(e){
    state.keyword = e.target.value.trim().toLowerCase();
    el('qClear').style.display = state.keyword ? 'block' : 'none';
    render();
  });

  el('qClear').addEventListener('click', function(){
    el('q').value = ''; state.keyword = ''; el('qClear').style.display = 'none';
    el('q').focus(); render();
  });

  groupsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip');
    if (!b) return;
    state.group = b.getAttribute('data-g');
    renderGroups(); render();
  });

  el('btnOnline').addEventListener('click', function(){
    state.status = state.status === 'online' ? 'all' : 'online';
    render();
  });

  el('btnOffline').addEventListener('click', function(){
    state.status = state.status === 'offline' ? 'all' : 'offline';
    render();
  });

  el('btnRecheck').addEventListener('click', function(){
    state.spotId = null;
    pickSpot();
    startCheck();
  });

  spotEl.addEventListener('click', function(e){
    var cp = e.target.closest('[data-copy]');
    if (cp){ copyText(cp.getAttribute('data-copy')); return; }
    if (e.target.id === 'btnReroll'){
      pickSpot();
      render();
      spotEl.classList.add('flash');
      setTimeout(function(){ spotEl.classList.remove('flash'); }, 700);
    }
  });

  listEl.addEventListener('click', function(e){
    var cp = e.target.closest('.cp');
    if (!cp) return;
    e.preventDefault();
    copyText(cp.getAttribute('data-url'));
    var old = cp.textContent;
    cp.textContent = '已复制'; cp.classList.add('ok');
    setTimeout(function(){ cp.textContent = old; cp.classList.remove('ok'); }, 1200);
  });

  function copyText(text){
    function done(){ toast('已复制：' + (text.length > 48 ? text.slice(0, 48) + '…' : text)); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta); done();
    }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
  }

  /* ================= 数据抽屉 ================= */
  function syncDrawer(){ el('jsonBox').value = JSON.stringify(RAW, null, 2); }
  function openDrawer(){
    syncDrawer();
    el('mask').classList.add('show');
    el('drawer').classList.add('show');
  }
  function closeDrawer(){
    el('mask').classList.remove('show');
    el('drawer').classList.remove('show');
  }
  el('btnData').addEventListener('click', openDrawer);
  el('btnCloseDrawer').addEventListener('click', closeDrawer);
  el('mask').addEventListener('click', closeDrawer);

  el('btnApply').addEventListener('click', function(){
    try {
      var raw = JSON.parse(el('jsonBox').value);
      if (!raw.items || !raw.groups) throw new Error('缺少 items / groups');
      RAW = raw;
      DATA = normalize(raw);
      DATA.updated = raw.updated || '';
      DATA.site = raw.site || {};
      state.spotId = null;
      renderHead(); renderGroups(); pickSpot(); render();
      closeDrawer();
      toast('已应用 ' + DATA.items.length + ' 条，开始检测');
      startCheck();
    } catch(err){
      toast('JSON 有误：' + err.message);
    }
  });

  el('btnImport').addEventListener('click', function(){ el('fileInput').click(); });
  el('fileInput').addEventListener('change', function(e){
    var f = e.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){ el('jsonBox').value = fr.result; toast('已载入，点「应用」生效'); };
    fr.readAsText(f, 'utf-8');
    e.target.value = '';
  });

  el('btnExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(RAW, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tvbox-data.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  });

  el('btnReset').addEventListener('click', function(){
    syncDrawer();
    toast('已恢复为页面内置内容（点「应用」生效）');
  });

  /* ================= 启动 ================= */
  RAW = JSON.parse(DEFAULT_JSON);
  DATA = normalize(RAW);
  DATA.updated = RAW.updated || '';
  DATA.site = RAW.site || {};
  renderHead();
  renderGroups();
  pickSpot();
  render();

  // 打开即检测：先渲染首屏，350ms 后开始
  setTimeout(startCheck, 350);

  // 进度兜底刷新（防止个别长尾任务时进度停滞）
  setInterval(function(){
    if (state.detecting) setProgress('检测中 ' + state.done + '/' + state.total, true);
  }, 1000);
})();
</script>
</body>
</html>
