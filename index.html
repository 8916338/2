<html lang="zh-CN">

<meta charset="utf-8">

<title>TVBox 接口导航</title>
<!--
  ============================================================
  TVBox 接口导航 · 单文件页面（数据与视图分离）
  ------------------------------------------------------------
  数据在页面底部的 DATA 脚本块（application/json）里。
  改数据两种方式：
    1) 直接改 DATA 里的 JSON
    2) 点右上角「{ } 数据」→ 粘贴 / 导入 tvbox-data.json → 应用
  ============================================================
-->
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --fg:#171a1f; --dim:#6b7280; --dim2:#9aa3b2;
  --line:#e8eaee; --soft:#f7f8fa; --acc:#e64a19; --acc-soft:#fff1ec;
  --ok:#16a34a; --ok-soft:#eaf7ee; --warn:#d97706; --warn-soft:#fef6e7;
  --off:#94a3b8; --off-soft:#f1f3f6;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1014; --card:#161920; --fg:#e7eaf0; --dim:#98a2b3; --dim2:#6b7480;
    --line:#232833; --soft:#1b1f28; --acc:#ff6b3d; --acc-soft:#2a1a13;
    --ok:#34d399; --ok-soft:#12251c; --warn:#fbbf24; --warn-soft:#2a2113;
    --off:#6b7480; --off-soft:#1a1e26;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{max-width:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 90px}

/* ---------- 顶部 ---------- */
.head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.head h1{margin:0;font-size:20px;letter-spacing:.2px;font-weight:700}
.head .spacer{flex:1}
.meta{font-size:12.5px;color:var(--dim);margin-bottom:6px}
.meta b{color:var(--fg);font-weight:600}
.icon-btn{
  flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);
  border-radius:9px;font-size:12.5px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);font-family:inherit;
}
.icon-btn:hover{color:var(--acc);border-color:var(--acc)}

/* ---------- 工具栏 ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 0}
.toolbar .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:12.5px;
  cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(.94);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn .n{font-variant-numeric:tabular-nums;opacity:.7;font-size:11.5px}
.btn.on.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.on.offb{background:var(--off-soft);border-color:var(--off);color:var(--fg);font-weight:600}
.progress{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.search{position:relative;margin:6px 0 8px}
.search input{
  width:100%;height:40px;padding:0 40px 0 38px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--fg);font-size:14px;outline:none;transition:.15s;font-family:inherit;
}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search .mag{position:absolute;left:13px;top:10px;color:var(--dim2);font-size:16px;pointer-events:none}
.search .clear{position:absolute;right:8px;top:7px;width:26px;height:26px;border:0;background:transparent;color:var(--dim2);cursor:pointer;border-radius:6px;font-size:16px;display:none}
.search .clear:hover{color:var(--acc);background:var(--soft)}

/* ---------- 分组 ---------- */
.groups{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.groups::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:12.5px;cursor:pointer;
  transition:.15s;white-space:nowrap;font-family:inherit;
}
.chip:hover{color:var(--fg);border-color:var(--dim2)}
.chip.active{background:var(--fg);border-color:var(--fg);color:var(--card);font-weight:600}
.chip .c{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip.active .c{opacity:.75}
.chip.res{color:var(--dim2);border-style:dashed}
.chip.res.active{background:var(--off);border-color:var(--off);color:#fff;border-style:solid}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 15px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:border-color .15s, transform .15s;
}
.card:hover{border-color:#d6dae1;transform:translateY(-1px)}
@media (prefers-color-scheme:dark){.card:hover{border-color:#2f3644}}
.card.pin{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-soft),var(--card) 58%)}
.card.flash{animation:flash .8s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc-soft)}100%{box-shadow:var(--shadow)}}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctop h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.2px;min-width:0}
.w-badge{flex:none;font-size:10.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.pin-tag{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--acc);border-radius:5px;padding:1px 7px;white-space:nowrap}
.reroll{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:6px;height:20px;padding:0 6px;font-size:11px;cursor:pointer;font-family:inherit;line-height:1}
.reroll:hover{background:var(--acc);color:#fff}
.ctop .spacer{flex:1}
.st{font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.st.wait{color:var(--dim2);background:var(--off-soft)}
.st.ing{color:var(--acc);background:var(--acc-soft)}
.st.ok{color:var(--ok);background:var(--ok-soft)}
.st.mid{color:var(--warn);background:var(--warn-soft)}
.st.bad{color:var(--off);background:var(--off-soft)}
.card .desc{margin:5px 0 0;color:var(--dim);font-size:12.5px;line-height:1.6}
.meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.gtag{font-size:11px;border-radius:5px;padding:1.5px 7px;background:var(--acc-soft);color:var(--acc);font-weight:600;white-space:nowrap}
.gtag.res{background:var(--off-soft);color:var(--dim)}
.tag{font-size:11px;border-radius:5px;padding:1.5px 7px;background:var(--soft);color:var(--dim);white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:1px}
.src:hover{color:var(--acc);border-bottom-color:var(--acc)}
.src::after{content:"↗";font-size:10px;opacity:.7}

.urls{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.urls li{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:9px;padding:6px 9px;min-width:0}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--dim2)}
.dot.ok{background:var(--ok)}
.dot.mid{background:var(--warn)}
.dot.bad{background:var(--off)}
.dot.ing{background:var(--acc);animation:pulse 1.2s infinite}
.urls .u{flex:1;min-width:0;color:var(--fg);text-decoration:none;opacity:.9;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.urls .u:hover{color:var(--acc);opacity:1}
.urls .lat{flex:none;font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.urls .lat.ok{color:var(--ok);font-weight:600}
.urls .lat.mid{color:var(--warn);font-weight:600}
.cp{flex:none;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:11px;border-radius:6px;padding:3px 8px;cursor:pointer;transition:.15s;font-family:inherit}
.cp:hover{color:var(--acc);border-color:var(--acc)}
.cp.ok{color:var(--ok);border-color:var(--ok)}

.empty{text-align:center;color:var(--dim);padding:56px 20px;font-size:13.5px}
.empty .big{font-size:26px;display:block;margin-bottom:8px;opacity:.5}

/* ---------- 数据抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,24,.45);z-index:60;display:none}
.mask.show{display:block}
.drawer{
  position:fixed;z-index:61;top:0;right:0;height:100%;width:min(580px,94vw);
  background:var(--card);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;
}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h4{margin:0;font-size:14px}
.drawer header .spacer{flex:1}
.drawer .body{padding:12px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.drawer textarea{
  flex:1;min-height:320px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;
  background:var(--soft);color:var(--fg);padding:10px 12px;font:11.8px/1.55 ui-monospace,Menlo,monospace;outline:none;
}
.drawer textarea:focus{border-color:var(--acc)}
.drawer .hint{font-size:11.5px;color:var(--dim2);line-height:1.75}
.drawer .hint code{background:var(--soft);border-radius:4px;padding:0 4px;font-size:11px}
.drawer footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mini{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:11.5px;border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap;font-family:inherit}
.mini:hover{color:var(--acc);border-color:var(--acc)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:80;
  background:var(--fg);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.2s;max-width:80vw;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{margin-top:22px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.8}
.foot .note{margin-top:5px;opacity:.82}

@media (max-width:640px){
  .wrap{padding:14px 12px 80px}
  .head h1{font-size:18px}
  .progress{margin-left:0;width:100%}
  .card{padding:11px 12px}
  .urls .u{font-size:11.5px}
  .urls .lat{min-width:40px;font-size:11px}
}
</style>
</head>

<div class="wrap">

</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <header>
    <h4>数据（JSON）</h4>

    <button class="mini" id="btnCloseDrawer">关闭</button>
  </header>
  <div class="body">
    <div class="hint">
      改完点「应用」立即生效（不写回文件）。字段：<code>id</code> 渲染 ID（可省，自动生成）·
      <code>name</code> 名称 · <code>desc</code> 说明（可空）· <code>group</code> 分组 ·
      <code>tags</code> 标签（可空）· <code>source</code> 来源数组 <code>[{name,url}]</code>（可空）·
      <code>urls</code> 地址字符串数组。排序权重写在 <code>weights</code> 里，按名称精确匹配，数字越小越靠前。
    </div>
    <textarea id="jsonBox" spellcheck="false"></textarea>
    <div class="hint">也可以点「导入文件」，选中 <code>tvbox-data.json</code> 后点「应用」。</div>
  </div>
  <footer>
    <button class="btn primary" id="btnApply">应用</button>
    <button class="btn" id="btnImport">导入文件</button>
    <button class="btn" id="btnReset">恢复默认</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </footer>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var TIMEOUT_MS = 12000;   // 单条超时
var CONCURRENCY = 6;      // 并发数
var SLOW_MS = 1500;       // 超过则标黄
var NO_W = 1e9;           // 未配置权重的哨兵值

var DEFAULT_JSON = document.getElementById('DATA').textContent;
var RAW = null, DATA = null;

var state = {
  group: 'all', status: 'all', keyword: '',
  detecting: false, abort: false, done: 0, total: 0,
  seed: 0, pinId: null
};

function el(id){ return document.getElementById(id); }
var listEl = el('list'), groupsEl = el('groups');

/* ================= 工具 ================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function showUrl(u){ try { return decodeURI(u); } catch(e){ return u; } }
function hash(str, seed){
  var h = 2166136261 ^ (seed | 0);
  for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}
function toast(msg){
  var t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

/* ================= 归一化 ================= */
function normalize(raw){
  var gs = (raw.groups || []).map(function(g, i){
    return {
      id: g.id || ('g' + i), name: g.name || g.id || '其他',
      weight: typeof g.weight === 'number' ? g.weight : 10,
      isApi: g.isApi !== false
    };
  });
  var gm = {};
  gs.forEach(function(g){ gm[g.id] = g; });

  var W = raw.weights || {};
  var used = {};

  var items = (raw.items || []).map(function(it, i){
    var id = String(it.id || ('i' + i));
    if (used[id]) id = id + '-' + i;          // 渲染 ID 唯一
    used[id] = 1;

    var g = gm[it.group] || { id: it.group || 'other', name: '其他', isApi: false };
    var src = it.source;
    if (src && !Array.isArray(src)) src = [src];

    var urls = (it.urls || []).map(function(u){
      return typeof u === 'string' ? u : (u && u.url) || '';
    }).filter(Boolean).map(function(u, k){
      return { uid: id + '#' + k, url: u, status: 'wait', lat: null };
    });

    var w = W[it.name];                        // 权重按名称精确匹配

    return {
      id: id,
      name: it.name || '未命名',
      desc: it.desc || '',
      group: g.id, groupName: g.name, isApi: g.isApi,
      tags: Array.isArray(it.tags) ? it.tags.filter(Boolean) : [],
      weight: (typeof w === 'number' && w > 0) ? w : NO_W,
      source: (src || []).filter(function(s){ return s && (s.name || s.url); }),
      urls: urls, status: 'wait', lat: null,
      rand: hash(id, state.seed)
    };
  });

  return { groups: gs, items: items, site: raw.site || {}, rotate: raw.rotate || {} };
}

/* ================= 首条轮换 ================= */
function newSeed(){
  var rot = RAW.rotate || {};
  var n = Number(rot.randomRange) || 10000;
  if (rot.seed && rot.seed !== 'time-random') return Math.floor(hash(String(rot.seed), 0) * n);
  return Math.floor(Math.random() * n);
}

function haystack(it){
  return (it.name + ' ' + it.desc + ' ' + it.groupName + ' ' + it.tags.join(' ') + ' ' +
    it.source.map(function(s){ return (s.name || '') + ' ' + (s.url || ''); }).join(' ') + ' ' +
    it.urls.map(function(u){ return u.url; }).join(' ')).toLowerCase();
}

function pickPin(){
  var kws = ((RAW.rotate || {}).keywords || []).filter(Boolean).map(function(k){
    return String(k).toLowerCase();
  });
  var pool = kws.length ? DATA.items.filter(function(it){
    var hay = haystack(it);
    return kws.some(function(k){ return hay.indexOf(k) !== -1; });
  }) : DATA.items.slice();

  if (!pool.length) pool = DATA.items.slice();     // 关键词没命中 → 全量兜底
  if (!pool.length){ state.pinId = null; return; }

  var idx = Math.floor(hash(pool.map(function(x){ return x.id; }).join('|'), state.seed) * pool.length);
  state.pinId = pool[Math.min(idx, pool.length - 1)].id;
}

/* ================= 头部 / 分组 ================= */
function renderHead(){
  el('title').textContent = DATA.site.title || 'TVBox 接口导航';
  var api = 0, url = 0;
  DATA.items.forEach(function(i){ if (i.isApi) api++; url += i.urls.length; });
  var res = DATA.items.length - api;
  el('meta').innerHTML = '共 <b>' + api + '</b> 个接口' +
    (res ? ' · <b>' + res + '</b> 个空壳/其他' : '') +
    ' · <b>' + url + '</b> 条地址';
  el('foot').innerHTML =
    '<div>' + esc(DATA.site.footer || '') + '</div>' +
    '<div class="note">延时检测只验证服务器是否有响应（有响应即有效），不校验接口内容；' +
    '返回 403、404、图片或错误页都属正常，实际能否解析以 TVBox 内为准。</div>';
}

function renderGroups(){
  var counts = { all: DATA.items.length };
  DATA.items.forEach(function(i){ counts[i.group] = (counts[i.group] || 0) + 1; });

  var html = '<button class="chip' + (state.group === 'all' ? ' active' : '') +
             '" data-g="all">全部 <span class="c">' + counts.all + '</span></button>';
  DATA.groups.forEach(function(g){
    var n = counts[g.id] || 0;
    if (!n) return;
    html += '<button class="chip' + (g.isApi ? '' : ' res') + (state.group === g.id ? ' active' : '') +
            '" data-g="' + esc(g.id) + '">' + esc(g.name) + ' <span class="c">' + n + '</span></button>';
  });
  groupsEl.innerHTML = html;
}

/* ================= 状态 ================= */
function itemStatus(it){
  var best = null, checking = false, blocked = false, allDown = it.urls.length > 0;
  it.urls.forEach(function(u){
    if (u.status === 'ok' && (best === null || u.lat < best)) best = u.lat;
    if (u.status === 'checking') checking = true;
    if (u.status === 'blocked') blocked = true;
    if (u.status !== 'bad' && u.status !== 'blocked') allDown = false;
  });
  if (best !== null){ it.status = 'ok'; it.lat = best; return; }
  if (checking){ it.status = 'wait'; it.lat = null; return; }
  if (allDown){ it.status = blocked ? 'blocked' : 'bad'; it.lat = null; return; }
  it.status = 'wait'; it.lat = null;
}

function statusMeta(st, lat){
  if (st === 'ok') return { cls: lat >= SLOW_MS ? 'mid' : 'ok', text: lat + ' ms' };
  if (st === 'bad') return { cls: 'bad', text: '离线' };
  if (st === 'blocked') return { cls: 'bad', text: '受限' };
  return { cls: 'wait', text: '待检测' };
}

/* ================= 卡片 ================= */
function cardHtml(it, pin){
  var sm = statusMeta(it.status, it.lat);

  var meta = '<span class="gtag' + (it.isApi ? '' : ' res') + '">' + esc(it.groupName) + '</span>';
  it.tags.forEach(function(t){ meta += '<span class="tag">' + esc(t) + '</span>'; });
  it.source.forEach(function(s){
    meta += s.url
      ? '<a class="src" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name || s.url) + '</a>'
      : '<span class="tag">' + esc(s.name) + '</span>';
  });

  var urls = it.urls.map(function(u){
    var cls = u.status === 'ok' ? (u.lat >= SLOW_MS ? 'mid' : 'ok')
            : u.status === 'checking' ? 'ing'
            : (u.status === 'bad' || u.status === 'blocked') ? 'bad' : '';
    var lat = u.status === 'ok' ? (u.lat + ' ms')
            : u.status === 'checking' ? '…'
            : u.status === 'bad' ? '离线'
            : u.status === 'blocked' ? '受限' : '—';
    return '<li data-uid="' + esc(u.uid) + '">' +
      '<span class="dot ' + cls + '"></span>' +
      '<a class="u" href="' + esc(u.url) + '" target="_blank" rel="noopener" title="' + esc(u.url) + '">' + esc(showUrl(u.url)) + '</a>' +
      '<span class="lat' + (cls ? ' ' + cls : '') + '">' + lat + '</span>' +
      '<button class="cp" data-url="' + esc(u.url) + '">复制</button>' +
    '</li>';
  }).join('');

  return '<article class="card' + (pin ? ' pin' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="ctop">' +
      (pin ? '<span class="pin-tag">随机展示</span>' : '') +
      '<h3>' + esc(it.name) + '</h3>' +
      (it.weight !== NO_W ? '<span class="w-badge" title="排序权重，数字越小越靠前">W' + it.weight + '</span>' : '') +
      (pin ? '<button class="reroll" id="btnReroll" title="换一条">↻ 换一条</button>' : '') +
      '<span class="spacer"></span>' +
      '<span class="st ' + sm.cls + '">' + sm.text + '</span>' +
    '</div>' +
    (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : '') +
    '<div class="meta-row">' + meta + '</div>' +
    (it.urls.length ? '<ul class="urls">' + urls + '</ul>' : '') +
  '</article>';
}

/* ================= 排序 / 过滤 ================= */
function rank(it){
  if (it.status === 'ok') return 0;                              // 在线
  if (it.status === 'bad' || it.status === 'blocked') return 2;  // 离线
  return 1;                                                      // 待检测
}

function matched(it){
  if (state.group !== 'all' && it.group !== state.group) return false;
  if (state.status === 'online' && it.status !== 'ok') return false;
  if (state.status === 'offline' && !(it.status === 'bad' || it.status === 'blocked')) return false;
  if (!state.keyword) return true;
  return haystack(it).indexOf(state.keyword) !== -1;
}

function render(){
  var rows = DATA.items.filter(matched).sort(function(a, b){
    var d = rank(a) - rank(b);
    if (d) return d;
    if (a.weight !== b.weight) return a.weight - b.weight;   // 有权重：升序
    return a.rand - b.rand;                                  // 无权重：随机混排
  });

  var pin = null;
  if (state.pinId){
    for (var i = 0; i < rows.length; i++){
      if (rows[i].id === state.pinId){ pin = rows.splice(i, 1)[0]; break; }
    }
  }

  var html = pin ? cardHtml(pin, true) : '';
  html += rows.map(function(it){ return cardHtml(it, false); }).join('');
  if (!html){
    html = '<div class="empty"><span class="big">∅</span>没有匹配的接口<br>' +
           '<span style="font-size:12px;opacity:.7">换个分组或清空搜索，也可以点「重新检测」</span></div>';
  }
  listEl.innerHTML = html;
  updateCounts();
}

function updateCounts(){
  var on = 0, off = 0;
  DATA.items.forEach(function(it){
    if (it.status === 'ok') on++;
    else if (it.status === 'bad' || it.status === 'blocked') off++;
  });
  el('nOnline').textContent = on;
  el('nOffline').textContent = off;
  el('btnOnline').classList.toggle('on', state.status === 'online');
  el('btnOnline').classList.toggle('okb', state.status === 'online');
  el('btnOffline').classList.toggle('on', state.status === 'offline');
  el('btnOffline').classList.toggle('offb', state.status === 'offline');
}

/* ================= 局部更新 ================= */
function patchUrl(uid){
  var it = null, u = null;
  for (var i = 0; i < DATA.items.length && !u; i++){
    var us = DATA.items[i].urls;
    for (var j = 0; j < us.length; j++){
      if (us[j].uid === uid){ it = DATA.items[i]; u = us[j]; break; }
    }
  }
  if (!u) return;

  var li = listEl.querySelector('li[data-uid="' + uid + '"]');
  if (li){
    var cls = u.status === 'ok' ? (u.lat >= SLOW_MS ? 'mid' : 'ok')
            : u.status === 'checking' ? 'ing'
            : (u.status === 'bad' || u.status === 'blocked') ? 'bad' : '';
    li.querySelector('.dot').className = 'dot ' + cls;
    var lat = li.querySelector('.lat');
    lat.className = 'lat' + (cls ? ' ' + cls : '');
    lat.textContent = u.status === 'ok' ? (u.lat + ' ms')
                    : u.status === 'checking' ? '…'
                    : u.status === 'bad' ? '离线'
                    : u.status === 'blocked' ? '受限' : '—';

    var card = li.closest('.card');
    if (card){
      itemStatus(it);
      var sm = statusMeta(it.status, it.lat);
      var st = card.querySelector('.st');
      st.className = 'st ' + sm.cls;
      st.textContent = sm.text;
    }
  }
  itemStatus(it);
  updateCounts();
}

/* ================= 检测 ================= */
function noCache(url){
  return url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();
}

/*
  检测口径：只要服务器有响应就算在线，不校验返回内容。
  TVBox 才带特定 UA/环境，浏览器拿到的 403 / 404 / 错误页 / 图片都是正常现象，
  因此这里只判断「连得上、有响应」，no-cors 拿到 opaque 响应即视为成功。
  拿到响应就立刻 abort，不下载正文，延时等于首字节时间。
*/
function probe(url){
  // https 页面请求 http 目标会被浏览器当作混合内容拦截
  if (location.protocol === 'https:' && /^http:\/\//i.test(url)) return Promise.resolve({ blocked: true });

  var ctrl = new AbortController();
  var t0 = performance.now();
  var timer = setTimeout(function(){ ctrl.abort(); }, TIMEOUT_MS);

  return fetch(noCache(url), {
    method: 'GET', mode: 'no-cors', cache: 'no-store', redirect: 'follow',
    credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctrl.signal
  }).then(function(){
    clearTimeout(timer);
    var lat = Math.round(performance.now() - t0);
    try { ctrl.abort(); } catch(e){}   // 有响应即可，立刻断开，省流量
    return { ok: true, lat: lat };
  }).catch(function(){
    clearTimeout(timer);
    return { ok: false };
  });
}

function setProgress(text, spinning){
  el('progress').innerHTML = (spinning ? '<span class="pulse"></span>' : '') + '<span>' + esc(text) + '</span>';
}

function startCheck(){
  if (state.detecting) return;
  state.detecting = true; state.abort = false; state.done = 0;

  var queue = [];
  DATA.items.forEach(function(it){
    it.urls.forEach(function(u){ u.status = 'wait'; u.lat = null; queue.push({ it: it, u: u }); });
    it.status = 'wait'; it.lat = null;
  });
  render();

  state.total = queue.length;
  var btn = el('btnRecheck');
  btn.disabled = true;
  btn.textContent = '检测中…';
  setProgress('检测中 0/' + queue.length, true);

  var idx = 0;
  function worker(){
    if (state.abort || idx >= queue.length) return Promise.resolve();
    var job = queue[idx++];
    job.u.status = 'checking';
    patchUrl(job.u.uid);
    return probe(job.u.url).then(function(r){
      if (state.abort) return;
      job.u.status = r.blocked ? 'blocked' : (r.ok ? 'ok' : 'bad');
      job.u.lat = r.ok ? r.lat : null;
      state.done++;
      patchUrl(job.u.uid);
      setProgress('检测中 ' + state.done + '/' + state.total, true);
      return worker();
    });
  }

  var workers = [];
  for (var i = 0; i < Math.min(CONCURRENCY, queue.length); i++) workers.push(worker());

  Promise.all(workers).then(function(){
    state.detecting = false;
    btn.disabled = false;
    btn.textContent = '⟳ 重新检测';
    var on = DATA.items.filter(function(x){ return x.status === 'ok'; }).length;
    setProgress('检测完成 · 在线 ' + on + ' / ' + DATA.items.length, false);
    render();   // 在线 → 权重 → 随机
  });
}

/* ================= 事件 ================= */
el('q').addEventListener('input', function(e){
  state.keyword = e.target.value.trim().toLowerCase();
  el('qClear').style.display = state.keyword ? 'block' : 'none';
  render();
});

el('qClear').addEventListener('click', function(){
  el('q').value = ''; state.keyword = '';
  el('qClear').style.display = 'none';
  el('q').focus();
  render();
});

groupsEl.addEventListener('click', function(e){
  var b = e.target.closest('.chip');
  if (!b) return;
  state.group = b.getAttribute('data-g');
  // 切换分组时清空搜索
  if (state.keyword){
    state.keyword = '';
    el('q').value = '';
    el('qClear').style.display = 'none';
  }
  renderGroups(); render();
});

el('btnOnline').addEventListener('click', function(){
  state.status = state.status === 'online' ? 'all' : 'online';
  render();
});

el('btnOffline').addEventListener('click', function(){
  state.status = state.status === 'offline' ? 'all' : 'offline';
  render();
});

el('btnRecheck').addEventListener('click', startCheck);

listEl.addEventListener('click', function(e){
  if (e.target.id === 'btnReroll'){
    state.seed = newSeed();
    DATA.items.forEach(function(it){ it.rand = hash(it.id, state.seed); });
    pickPin();
    render();
    var c = listEl.querySelector('.card.pin');
    if (c){ c.classList.add('flash'); setTimeout(function(){ c.classList.remove('flash'); }, 700); }
    return;
  }
  var cp = e.target.closest('.cp');
  if (!cp) return;
  e.preventDefault();
  copyText(cp.getAttribute('data-url'));
  var old = cp.textContent;
  cp.textContent = '已复制'; cp.classList.add('ok');
  setTimeout(function(){ cp.textContent = old; cp.classList.remove('ok'); }, 1200);
});

function copyText(text){
  function done(){ toast('已复制：' + (text.length > 48 ? text.slice(0, 48) + '…' : text)); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(err){}
    document.body.removeChild(ta); done();
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

/* ================= 数据抽屉 ================= */
function openDrawer(){
  el('jsonBox').value = JSON.stringify(RAW, null, 2);
  el('mask').classList.add('show');
  el('drawer').classList.add('show');
}
function closeDrawer(){
  el('mask').classList.remove('show');
  el('drawer').classList.remove('show');
}
el('btnData').addEventListener('click', openDrawer);
el('btnCloseDrawer').addEventListener('click', closeDrawer);
el('mask').addEventListener('click', closeDrawer);

function apply(raw){
  RAW = raw;
  state.seed = newSeed();          // 每次加载/应用都换一个随机种子
  DATA = normalize(raw);           // 归一化时按新种子算好随机排序值
  renderHead(); renderGroups(); pickPin(); render();
}

el('btnApply').addEventListener('click', function(){
  try {
    var raw = JSON.parse(el('jsonBox').value);
    if (!raw.items || !raw.groups) throw new Error('缺少 items / groups');
    apply(raw);
    closeDrawer();
    toast('已应用 ' + DATA.items.length + ' 条，开始检测');
    startCheck();
  } catch(err){
    toast('JSON 有误：' + err.message);
  }
});

el('btnImport').addEventListener('click', function(){ el('fileInput').click(); });
el('fileInput').addEventListener('change', function(e){
  var f = e.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){ el('jsonBox').value = fr.result; toast('已载入，点「应用」生效'); };
  fr.readAsText(f, 'utf-8');
  e.target.value = '';
});

el('btnExport').addEventListener('click', function(){
  var blob = new Blob([JSON.stringify(RAW, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tvbox-data.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
});

el('btnReset').addEventListener('click', function(){
  apply(JSON.parse(DEFAULT_JSON));
  closeDrawer();
  toast('已恢复页面内置数据');
  startCheck();
});

/* ================= 启动 ================= */
apply(JSON.parse(DEFAULT_JSON));
setTimeout(startCheck, 350);   // 先出首屏，再开始检测
})();
</script>
</body>
</html>
