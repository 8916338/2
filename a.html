<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>好多接口</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --fg:#171a1f; --dim:#6b7280; --dim2:#9aa3b2;
  --line:#e8eaee; --soft:#f7f8fa; --acc:#e64a19; --acc-soft:#fff1ec;
  --ok:#16a34a; --ok-soft:#eaf7ee; --warn:#d97706; --warn-soft:#fef6e7;
  --off:#94a3b8; --off-soft:#f1f3f6;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1014; --card:#161920; --fg:#e7eaf0; --dim:#98a2b3; --dim2:#6b7480;
    --line:#232833; --soft:#1b1f28; --acc:#ff6b3d; --acc-soft:#2a1a13;
    --ok:#34d399; --ok-soft:#12251c; --warn:#fbbf24; --warn-soft:#2a2113;
    --off:#6b7480; --off-soft:#1a1e26;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{max-width:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 90px}
.head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.head h1{margin:0;font-size:20px;letter-spacing:.2px;font-weight:700;text-align:center}
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 0}
.toolbar .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:12.5px;
  cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(.94);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn .n{font-variant-numeric:tabular-nums;opacity:.7;font-size:11.5px}
.btn.on.allb{background:var(--fg);border-color:var(--fg);color:var(--card);font-weight:600}
.btn.on.allb .n{opacity:.75}
.btn.on.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.on.offb{background:var(--off-soft);border-color:var(--off);color:var(--fg);font-weight:600}
.progress{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.search{position:relative;margin:6px 0 8px}
.search input{
  width:100%;height:40px;padding:0 40px 0 38px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--fg);font-size:14px;outline:none;transition:.15s;font-family:inherit;
}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search .mag{position:absolute;left:13px;top:10px;color:var(--dim2);font-size:16px;pointer-events:none}
.search .clear{position:absolute;right:8px;top:7px;width:26px;height:26px;border:0;background:transparent;color:var(--dim2);cursor:pointer;border-radius:6px;font-size:16px;display:none}
.search .clear:hover{color:var(--acc);background:var(--soft)}
.groups{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.groups::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:12.5px;cursor:pointer;
  transition:.15s;white-space:nowrap;font-family:inherit;
}
.chip:hover{color:var(--fg);border-color:var(--dim2)}
.chip.active{background:var(--fg);border-color:var(--fg);color:var(--card);font-weight:600}
.chip .c{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip.active .c{opacity:.75}
.chip.res{color:var(--dim2);border-style:dashed}
.chip.res.active{background:var(--off);border-color:var(--off);color:#fff;border-style:solid}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 15px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:border-color .15s, transform .15s;
}
.card:hover{border-color:#d6dae1;transform:translateY(-1px)}
@media (prefers-color-scheme:dark){.card:hover{border-color:#2f3644}}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctop h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.2px;min-width:0}
.ctop .spacer{flex:1}
.logo{flex:none;width:26px;height:26px;border-radius:7px;object-fit:cover;background:var(--soft)}
.cover{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin:9px 0 0;background:var(--soft)}
.st{font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.st.wait{color:var(--dim2);background:var(--off-soft)}
.st.ok{color:var(--ok);background:var(--ok-soft)}
.st.mid{color:var(--warn);background:var(--warn-soft)}
.st.bad{color:var(--off);background:var(--off-soft)}
.st.wt{color:var(--dim2);background:var(--off-soft)}
.card .desc{margin:5px 0 0;color:var(--dim);font-size:12.5px;line-height:1.6}
.meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.gtag{font-size:11px;border-radius:5px;padding:1.5px 7px;background:var(--acc-soft);color:var(--acc);font-weight:600;white-space:nowrap}
.gtag.res{background:var(--off-soft);color:var(--dim)}
.tag{font-size:11px;border-radius:5px;padding:1.5px 7px;background:var(--soft);color:var(--dim);white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:1px}
.src:hover{color:var(--acc);border-bottom-color:var(--acc)}
.src::after{content:"↗";font-size:10px;opacity:.7}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--acc);text-decoration:none;background:var(--acc-soft);border-radius:6px;padding:3px 9px}
.lnk:hover{filter:brightness(.96);text-decoration:underline}
.card.dl,.card.lk{padding:10px 12px}
.irow{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.irow .ic{
  position:relative;flex:none;width:44px;height:44px;border-radius:11px;overflow:hidden;
  background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;
}
.irow .ic i{font-style:normal;font-size:16px;font-weight:700;color:var(--dim2);line-height:1}
.irow .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent}
.irow .bd{flex:1;min-width:0}
.irow .tt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.irow .tt h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;letter-spacing:.2px}
.irow .v{
  flex:none;font-size:10.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);
  border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums;
}
.irow .d{
  margin:2px 0 0;font-size:12px;color:var(--dim);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.irow .go{
  flex:none;font-size:12px;font-weight:600;border-radius:8px;padding:6px 13px;
  background:var(--soft);color:var(--acc);white-space:nowrap;transition:.15s;
}
.irow.dl .go{background:var(--acc);color:#fff}
.irow.lk:hover .go{background:var(--acc);color:#fff}
.irow .st{flex:none}
.card.dl .meta-row,.card.lk .meta-row{padding-left:56px}
@media (max-width:540px){.card.dl .meta-row,.card.lk .meta-row{padding-left:47px}}
@media (max-width:540px){
  .card.dl,.card.lk{padding:9px 11px}
  .irow{gap:9px}
  .irow .ic{width:38px;height:38px;border-radius:9px}
  .irow .tt h3{font-size:14px}
  .irow .go{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .irow .d{white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
}
.urls{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.urls li{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:9px;padding:6px 9px;min-width:0}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--dim2)}
.dot.ok{background:var(--ok)}
.dot.mid{background:var(--warn)}
.dot.bad{background:var(--off)}
.dot.wt{background:transparent;box-shadow:inset 0 0 0 1px var(--dim2)}
.dot.ing{background:var(--acc);animation:pulse 1.2s infinite}
.urls .u{flex:1;min-width:0;color:var(--fg);text-decoration:none;opacity:.9;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.urls .u:hover{color:var(--acc);opacity:1}
.urls .lat{flex:none;font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.urls .lat.ok{color:var(--ok);font-weight:600}
.urls .lat.mid{color:var(--warn);font-weight:600}
.urls .lat.wt{color:var(--dim2)}
.cp{flex:none;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:11px;border-radius:6px;padding:3px 8px;cursor:pointer;transition:.15s;font-family:inherit}
.cp:hover{color:var(--acc);border-color:var(--acc)}
.cp.ok{color:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--dim);padding:56px 20px;font-size:13.5px}
.empty .big{font-size:26px;display:block;margin-bottom:8px;opacity:.5}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:80;
  background:var(--fg);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.2s;max-width:80vw;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{margin-top:22px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.8}
@media (max-width:640px){
  .wrap{padding:14px 12px 80px}
  .head h1{font-size:18px}
  .progress{margin-left:0;width:100%}
  .card{padding:11px 12px}
  .urls .u{font-size:11.5px}
  .urls .lat{min-width:46px;font-size:11px}
}
</style>
</head>

            meta: 'version', desc: 'desc', url: 'url', action: '前往' }
        ]
      },
      media: {
        class: 'media',
        blocks: [
          { as: 'header', field: 'name', status: false, logo: true },
          { as: 'image', field: 'cover', class: 'cover' },
          { as: 'text', field: 'desc' },
          { as: 'tags', field: 'tags', inline: true },
          { as: 'links', field: 'links', inline: true }
        ]
      }
    }
  };

  function normalize(raw) {
    var render = (raw.render && raw.render.types) ? raw.render : RENDER;
    var def = render.default || 'default';

    var gs = (raw.groups || []).map(function (g, i) {
      return {
        id: g.id || ('g' + i),
        name: g.name || g.id || '其他',
        isApi: g.isApi !== false,
        res: g.res === true
      };
    });
    var gm = {};
    gs.forEach(function (g) { gm[g.id] = g; });

    var W = raw.weights || {};

    var items = (raw.items || []).map(function (src, i) {
      var o = {};
      for (var k in src) {
        if (Object.prototype.hasOwnProperty.call(src, k)) o[k] = src[k];
      }

      var g = gm[src.group] || { id: src.group || 'other', name: '其他', isApi: false };
      var rawList = Array.isArray(src.urls) ? src.urls.slice()
                  : (src.urls ? [src.urls] : []);
      if (!rawList.length && src.url) rawList.push(src.url);

      var urls = rawList.map(function (u) {
        return typeof u === 'string' ? u : (u && u.url) || '';
      }).filter(Boolean).map(function (u, k) {
        return { uid: i + '#' + k, url: u, status: 'wait', lat: null };
      });

      o._i = i;
      o._type = src.type || def;
      o._group = g.id;
      o._groupName = g.name;
      o._isApi = g.isApi;
      o._res = g.res === true;
      o._urls = urls;
      o._status = 'wait';
      o._lat = null;
      o._weight = (typeof W[src.name] === 'number' && W[src.name] > 0) ? W[src.name] : NO_W;
      o._rand = hash(i + '|' + (src.name || ''), state.seed);
      o._hay = (flat(src) + ' ' + urls.map(function (u) { return u.url; }).join(' ')).toLowerCase();
      return o;
    });

    return {
      groups: gs,
      items: items,
      site: raw.site || {},
      rotate: raw.rotate || {},
      render: render
    };
  }

  function newSeed() {
    var rot = RAW.rotate || {};
    var n = Number(rot.randomRange) || 10000;
    if (rot.seed && rot.seed !== 'time-random') return Math.floor(hash(String(rot.seed), 0) * n);
    return Math.floor(Math.random() * n);
  }

  function pickPin() {
    var kws = ((RAW.rotate || {}).keywords || []).filter(Boolean).map(function (k) {
      return String(k).toLowerCase();
    });
    var pool = kws.length ? DATA.items.filter(function (it) {
      return kws.some(function (k) { return it._hay.indexOf(k) !== -1; });
    }) : DATA.items.slice();

    if (!pool.length) pool = DATA.items.slice();
    if (!pool.length) { state.pinIdx = -1; return; }

    var idx = Math.floor(hash(pool.map(function (x) { return x._i; }).join('|'), state.seed) * pool.length);
    state.pinIdx = pool[Math.min(idx, pool.length - 1)]._i;
  }

  function renderHead() {
    el('title').textContent = DATA.site.title || '好多接口';
    el('foot').textContent = DATA.site.footer || '';
  }

  function renderGroups() {
    var counts = {};
    DATA.items.forEach(function (i) { counts[i._group] = (counts[i._group] || 0) + 1; });

    var html = '';
    DATA.groups.forEach(function (g) {
      var n = counts[g.id] || 0;
      if (!n) return;
      html += '<button class="chip' + (g.res ? ' res' : '') + (state.group === g.id ? ' active' : '') +
              '" data-g="' + esc(g.id) + '">' + esc(g.name) + ' <span class="c">' + n + '</span></button>';
    });
    html += '<button class="chip' + (state.group === 'all' ? ' active' : '') +
            '" data-g="all">全部 <span class="c">' + DATA.items.length + '</span></button>';
    groupsEl.innerHTML = html;
  }

  function itemStatus(it) {
    var best = null, checking = false, allDown = it._urls.length > 0;
    it._urls.forEach(function (u) {
      if (u.status === 'ok' && (best === null || u.lat < best)) best = u.lat;
      if (u.status === 'checking' || u.status === 'wait') checking = true;
      if (u.status !== 'bad') allDown = false;
    });
    if (best !== null) { it._status = 'ok'; it._lat = best; return; }
    if (checking) { it._status = 'wait'; it._lat = null; return; }
    if (allDown) { it._status = 'bad'; it._lat = null; return; }
    it._status = 'wait';
    it._lat = null;
  }

  function statusMeta(it) {
    if (it._status === 'ok') return { cls: it._lat >= SLOW_MS ? 'mid' : 'ok', text: it._lat + ' ms' };
    if (it._status === 'bad') return { cls: 'bad', text: '离线' };
    return { cls: 'wait', text: '未检测' };
  }

  function blockHtml(it, b) {
    var v = b.field ? it[b.field] : null;

    switch (b.as) {
      case 'header':
        var logo = b.logo && it.logo ? '<img class="logo" src="' + esc(it.logo) + '" alt="" loading="lazy">' : '';
        var name = it[b.field || 'name'] || '';
        var pill = (b.status !== false && it._urls.length) ? statusMeta(it) : null;
        return '<div class="ctop">' + logo + '<h3>' + esc(name) + '</h3>' +
          (pill ? '<span class="spacer"></span><span class="st ' + pill.cls + '">' + pill.text + '</span>' : '') +
        '</div>';

      case 'text':
        return v ? '<p class="desc">' + esc(v) + '</p>' : '';

      case 'group':
        return '<span class="gtag' + (it._res ? ' res' : '') + '">' + esc(it._groupName) + '</span>';

      case 'tags':
        return (Array.isArray(v) ? v : []).filter(Boolean).map(function (t) {
          return '<span class="tag">' + esc(t) + '</span>';
        }).join('');

      case 'sources':
        return asList(v).map(function (s) {
          return s.url
            ? '<a class="src" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name || s.url) + '</a>'
            : '<span class="tag">' + esc(s.name) + '</span>';
        }).join('');

      case 'links':
        return asList(v).map(function (s) {
          return '<a class="lnk" href="' + esc(s.url || '#') + '" target="_blank" rel="noopener">' + esc(s.name || s.url) + '</a>';
        }).join('');

      case 'image':
        return v ? '<img class="' + esc(b.class || 'cover') + '" src="' + esc(v) + '" alt="" loading="lazy">' : '';

      case 'row': {
        var title = it[b.title || 'name'] || '';
        var icon = b.icon ? it[b.icon] : '';
        var meta = b.meta ? it[b.meta] : '';
        var desc = b.desc ? it[b.desc] : '';
        var href = b.url ? it[b.url] : (it._urls[0] ? it._urls[0].url : '');
        var act = b.action || '';
        var rpill = (b.status !== false && it._urls.length) ? statusMeta(it) : null;
        if (!title) return '';

        var ic = '<span class="ic"><i>' + esc(String(title).charAt(0)) + '</i>' +
                 (icon ? '<img src="' + esc(icon) + '" alt="">' : '') + '</span>';
        var tagOpen = href
          ? '<a class="irow ' + esc(b.kind || 'lk') + '" href="' + esc(href) + '" target="_blank" rel="noopener"' +
            (b.download ? ' download' : '') + '>'
          : '<div class="irow ' + esc(b.kind || 'lk') + '">';
        var tagClose = href ? '</a>' : '</div>';

        return tagOpen + ic +
          '<div class="bd"><div class="tt"><h3>' + esc(title) + '</h3>' +
            (meta ? '<span class="v">' + esc(meta) + '</span>' : '') +
          '</div>' +
          (desc ? '<p class="d">' + esc(desc) + '</p>' : '') + '</div>' +
          (rpill ? '<span class="st ' + rpill.cls + '">' + rpill.text + '</span>' : '') +
          (act ? '<span class="go">' + esc(act) + '</span>' : '') +
          tagClose;
      }

      case 'urls':
        if (!it._urls.length) return '';
        return '<ul class="urls">' + it._urls.map(function (u) {
          var cls = u.status === 'ok' ? (u.lat >= SLOW_MS ? 'mid' : 'ok')
                  : u.status === 'checking' ? 'ing'
                  : u.status === 'bad' ? 'bad' : 'wt';
          var lat = u.status === 'ok' ? (u.lat + ' ms')
                  : u.status === 'bad' ? '离线'
                  : u.status === 'checking' ? '检测中' : '未检测';
          return '<li data-uid="' + esc(u.uid) + '">' +
            '<span class="dot ' + cls + '"></span>' +
            '<a class="u" href="' + esc(u.url) + '" target="_blank" rel="noopener" title="' +
              esc(u.url) + '">' + esc(showUrl(u.url)) + '</a>' +
            '<span class="lat' + (cls ? ' ' + cls : '') + '">' + lat + '</span>' +
            '<button class="cp" data-url="' + esc(u.url) + '">复制</button>' +
          '</li>';
        }).join('') + '</ul>';

      default:
        return '';
    }
  }

  function typeOf(it) {
    var types = DATA.render.types || {};
    return types[it._type] || types[DATA.render.default] ||
           { blocks: [{ as: 'header' }, { as: 'text', field: 'desc' }, { as: 'urls' }] };
  }

  function cardHtml(it) {
    var tpl = typeOf(it);
    var blocks = tpl.blocks || [];
    var out = '', inline = '';

    blocks.forEach(function (b) {
      var h = blockHtml(it, b);
      if (!h) return;
      if (b.inline) { inline += h; return; }
      if (inline) { out += '<div class="meta-row">' + inline + '</div>'; inline = ''; }
      out += h;
    });
    if (inline) out += '<div class="meta-row">' + inline + '</div>';

    return '<article class="card' + (tpl.class ? ' ' + esc(tpl.class) : '') + '">' + out + '</article>';
  }

  function rank(it) {
    if (it._status === 'ok') return 0;
    if (it._status === 'bad') return 2;
    return 1;
  }

  function matched(it) {
    if (state.group !== 'all' && it._group !== state.group) return false;
    if (state.status === 'online' && it._status !== 'ok') return false;
    if (state.status === 'offline' && it._status !== 'bad') return false;
    if (!state.keyword) return true;
    return it._hay.indexOf(state.keyword) !== -1;
  }

  function render() {
    var rows = DATA.items.filter(matched).sort(function (a, b) {
      var d = rank(a) - rank(b);
      if (d) return d;
      if (a._weight !== b._weight) return a._weight - b._weight;
      return a._rand - b._rand;
    });

    if (state.pinIdx >= 0) {
      var pin = DATA.items[state.pinIdx];
      var pos = rows.indexOf(pin);
      if (pos > 0) { rows.splice(pos, 1); rows.unshift(pin); }
    }

    var html = rows.map(cardHtml).join('');
    if (!html) {
      html = '<div class="empty"><span class="big">∅</span>没有匹配的接口<br>' +
             '<span style="font-size:12px;opacity:.7">换个分组或清空搜索，也可以点「开始检测」</span></div>';
    }
    listEl.innerHTML = html;
    updateCounts();
  }

  function updateCounts() {
    var on = 0, off = 0;
    DATA.items.forEach(function (it) {
      if (it._status === 'ok') on++;
      else if (it._status === 'bad') off++;
    });
    el('nAll').textContent = DATA.items.length;
    el('btnAll').title = '显示全部：' + DATA.items.length + ' 个条目';
    el('nOnline').textContent = on;
    el('nOffline').textContent = off;

    el('btnAll').classList.toggle('on', state.status === 'all');
    el('btnAll').classList.toggle('allb', state.status === 'all');
    el('btnOnline').classList.toggle('on', state.status === 'online');
    el('btnOnline').classList.toggle('okb', state.status === 'online');
    el('btnOffline').classList.toggle('on', state.status === 'offline');
    el('btnOffline').classList.toggle('offb', state.status === 'offline');
  }

  function patchUrl(uid) {
    var p = uid.split('#');
    var it = DATA.items[+p[0]], u = it && it._urls[+p[1]];
    if (!u) return;

    itemStatus(it);

    var li = listEl.querySelector('li[data-uid="' + uid + '"]');
    if (li) {
      var cls = u.status === 'ok' ? (u.lat >= SLOW_MS ? 'mid' : 'ok')
              : u.status === 'checking' ? 'ing'
              : u.status === 'bad' ? 'bad' : 'wt';
      li.querySelector('.dot').className = 'dot ' + cls;
      var lat = li.querySelector('.lat');
      lat.className = 'lat' + (cls ? ' ' + cls : '');
      lat.textContent = u.status === 'ok' ? (u.lat + ' ms')
                      : u.status === 'bad' ? '离线'
                      : u.status === 'checking' ? '检测中' : '未检测';

      var card = li.closest('.card');
      if (card) {
        var sm = statusMeta(it);
        var st = card.querySelector('.st');
        if (st) { st.className = 'st ' + sm.cls; st.textContent = sm.text; }
      }
    }
    updateCounts();
  }

  var PROXY_TIMEOUT = 6000;
  var PROXIES = [];

  function noCache(url) {
    return url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();
  }

  function timedFetch(target, ms, mode) {
    var ctrl = new AbortController();
    var t0 = performance.now();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(target, {
      method: 'GET',
      mode: mode || 'no-cors',
      cache: 'no-store',
      redirect: 'follow',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      signal: ctrl.signal
    }).then(function (resp) {
      clearTimeout(timer);
      var lat = Math.round(performance.now() - t0);
      var status = (mode === 'cors') ? resp.status : 0;
      try { ctrl.abort(); } catch (e) {}
      return { ok: true, lat: lat, status: status };
    }).catch(function () {
      clearTimeout(timer);
      return { ok: false };
    });
  }

  function probe(url) {
    var mixed = location.protocol === 'https:' && /^http:\/\//i.test(url);

    return timedFetch(noCache(url), TIMEOUT_MS).then(function (r) {
      if (r.ok || !mixed) return r;

      var alt = 'https://' + url.slice(7);
      return timedFetch(noCache(alt), 6000).then(function (r2) {
        if (r2.ok) return r2;
        return viaProxy(url, 0);
      });
    });
  }

  function viaProxy(url, i) {
    if (i >= PROXIES.length) return Promise.resolve({ ok: false });
    var target = PROXIES[i].replace('{url}', encodeURIComponent(url));
    return timedFetch(target, PROXY_TIMEOUT, 'cors').then(function (r) {
      if (r.ok && r.status !== 401 && r.status !== 403 && r.status !== 407 && r.status !== 429) return r;
      return viaProxy(url, i + 1);
    });
  }

  function setProgress(text, spinning) {
    el('progress').innerHTML = (spinning ? '<span class="pulse"></span>' : '') + '<span>' + esc(text) + '</span>';
  }

  function countDone() {
    var done = 0, total = 0;
    DATA.items.forEach(function (it) {
      it._urls.forEach(function (u) {
        total++;
        if (u.status === 'ok' || u.status === 'bad') done++;
      });
    });
    return { done: done, total: total };
  }

  function updateProgress() {
    var c = countDone();
    setProgress('检测中 ' + c.done + '/' + c.total, true);
  }

  function updateCheckButton() {
    var btn = el('btnCheck');
    var restart = el('btnRestart');
    if (state.phase === 'running') {
      btn.textContent = '停止检测';
      btn.classList.remove('primary');
      restart.style.display = 'none';
    } else if (state.phase === 'stopped') {
      btn.textContent = '继续检测';
      btn.classList.add('primary');
      restart.style.display = '';
    } else if (state.phase === 'done') {
      btn.textContent = '重新检测';
      btn.classList.add('primary');
      restart.style.display = 'none';
    } else {
      btn.textContent = '开始检测';
      btn.classList.add('primary');
      restart.style.display = 'none';
    }
  }

  function resetAll() {
    DATA.items.forEach(function (it) {
      it._urls.forEach(function (u) { u.status = 'wait'; u.lat = null; });
      it._status = 'wait';
      it._lat = null;
    });
  }

  function runCheck(fresh) {
    var token = ++runToken;

    if (fresh) resetAll();

    var priorityGroup = state.group;

    if (state.status !== 'all' || state.group !== 'all' || state.keyword) {
      state.status = 'all';
      state.group = 'all';
      state.keyword = '';
      el('q').value = '';
      el('qClear').style.display = 'none';
      renderGroups();
    }

    var first = [], rest = [];
    DATA.items.forEach(function (it) {
      it._urls.forEach(function (u) {
        if (u.status === 'wait') {
          var job = { it: it, u: u };
          if (priorityGroup !== 'all' && it._group === priorityGroup) first.push(job);
          else rest.push(job);
        }
      });
    });
    var queue = first.concat(rest);

    state.phase = 'running';
    updateCheckButton();
    render();

    if (!queue.length) {
      state.phase = 'done';
      updateCheckButton();
      setProgress('检测完成', false);
      setTimeout(function () { if (state.phase === 'done') setProgress('', false); }, 2600);
      return;
    }

    updateProgress();

    var idx = 0;
    function worker() {
      if (token !== runToken) return Promise.resolve();
      if (idx >= queue.length) return Promise.resolve();
      var job = queue[idx++];
      job.u.status = 'checking';
      patchUrl(job.u.uid);
      return probe(job.u.url).then(function (r) {
        if (token !== runToken) return;
        job.u.status = r.ok ? 'ok' : 'bad';
        job.u.lat = r.ok ? r.lat : null;
        patchUrl(job.u.uid);
        updateProgress();
        return worker();
      });
    }

    var workers = [];
    for (var i = 0; i < Math.min(CONCURRENCY, queue.length); i++) workers.push(worker());

    Promise.all(workers).then(function () {
      if (token !== runToken) return;
      state.phase = 'done';
      updateCheckButton();
      setProgress('检测完成', false);
      setTimeout(function () { if (state.phase === 'done') setProgress('', false); }, 2600);
      render();
    });
  }

  function stopCheck() {
    if (state.phase !== 'running') return;
    runToken++;
    state.phase = 'stopped';
    DATA.items.forEach(function (it) {
      it._urls.forEach(function (u) { if (u.status === 'checking') u.status = 'wait'; });
      itemStatus(it);
    });
    updateCheckButton();
    render();
    setProgress('已停止', false);
  }

  el('q').addEventListener('input', function (e) {
    state.keyword = e.target.value.trim().toLowerCase();
    el('qClear').style.display = state.keyword ? 'block' : 'none';
    render();
  });

  el('qClear').addEventListener('click', function () {
    el('q').value = '';
    state.keyword = '';
    el('qClear').style.display = 'none';
    el('q').focus();
    render();
  });

  groupsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    state.group = b.getAttribute('data-g');
    if (state.keyword) {
      state.keyword = '';
      el('q').value = '';
      el('qClear').style.display = 'none';
    }
    renderGroups();
    render();
  });

  el('btnCheck').addEventListener('click', function () {
    if (state.phase === 'running') stopCheck();
    else if (state.phase === 'stopped') runCheck(false);
    else runCheck(true);
  });

  el('btnRestart').addEventListener('click', function () {
    runCheck(true);
  });

  el('btnAll').addEventListener('click', function () {
    state.status = 'all';
    render();
  });

  el('btnOnline').addEventListener('click', function () {
    state.status = state.status === 'online' ? 'all' : 'online';
    render();
  });

  el('btnOffline').addEventListener('click', function () {
    state.status = state.status === 'offline' ? 'all' : 'offline';
    render();
  });

  listEl.addEventListener('click', function (e) {
    var cp = e.target.closest('.cp');
    if (!cp) return;
    e.preventDefault();
    copyText(cp.getAttribute('data-url'));
    var old = cp.textContent;
    cp.textContent = '已复制';
    cp.classList.add('ok');
    setTimeout(function () { cp.textContent = old; cp.classList.remove('ok'); }, 1200);
  });

  function copyText(text) {
    function done() {
      toast('已复制：' + (text.length > 48 ? text.slice(0, 48) + '…' : text));
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
      done();
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
    else fallback();
  }

  function apply(raw) {
    RAW = raw;
    state.seed = newSeed();
    DATA = normalize(raw);
    renderHead();
    renderGroups();
    pickPin();
    render();
    updateCheckButton();
  }

  try {
    apply(JSON.parse(DEFAULT_JSON));
  } catch (err) {
    console.error('[DATA JSON 解析失败]', err);
    listEl.innerHTML =
      '<div class="empty"><span class="big">⚠</span>数据解析失败<br>' +
      '<span style="font-size:12px;opacity:.75">' + esc(err.message) + '</span></div>';
    setProgress('数据错误', false);
  }
})();
</script>
</body>
</html>
